# Configuração da Render (plano gratuito). O conteúdo publicado fica guardado em JSON num repositório
# separado do GitHub, porque o disco da Render grátis é apagado a cada reinício.
services:
  - type: web
    name: infopathos
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/me
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false        # a Render pergunta no primeiro deploy: é a senha do login da equipe
      - key: GITHUB_REPO
        sync: false        # ex.: Mil-hub10/infopathos-dados
      - key: GITHUB_TOKEN
        sync: false        # chave de acesso só a esse repositório (veja DEPLOY-RENDER.md)
